# Use the same locked Ruff installation as CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (safe fixes)
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
