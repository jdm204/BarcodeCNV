[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barcodecnv"
version = "0.1.0"
description = "Experimental Python port of barcode pseudobulk CN inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "scipy>=1.15", "numba>=0.61", "h5py>=3.10", "pandas>=2.2", "matplotlib>=3.8"]

[project.scripts]
barcodecnv = "barcodecnv.cli:main"

[dependency-groups]
dev = [
    "anndata>=0.10",
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
extend-exclude = [".preprocessing"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Numba's compiled zip does not support strict=; preserve Python/Numba parity.
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses containing immutable configuration values are safe defaults.
extend-immutable-calls = [
    "barcodecnv.model.Model",
    "barcodecnv.fitting.FitOptions",
    "barcodecnv.depth_controls.DepthOptions",
]
